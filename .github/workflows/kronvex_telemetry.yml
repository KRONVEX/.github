name: KRONVEX Telemetry & SVG Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - profile/README.md
      - .github/scripts/kronvex_engine.py
      - .github/workflows/kronvex_telemetry.yml
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: kronvex-org-telemetry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional market data client
        run: python -m pip install --quiet yfinance

      - name: Run KRONVEX SVG & Org Telemetry Engine
        env:
          ORG_ACCESS_TOKEN: ${{ secrets.ORG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: python .github/scripts/kronvex_engine.py --org "${ORG_NAME:-KRONVEX}"

      - name: Commit updated assets and org profile
        run: |-
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add profile/README.md assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): update KRONVEX org SVGs and ecosystem feed"
            git pull --rebase -X theirs origin main
            git push
          fi
