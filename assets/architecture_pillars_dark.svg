  <circle cx="173" cy="216" r="3.2" fill="#38BDF8"/>
  <path d="M 480 216 L 480 256" fill="none" stroke="#10B981" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="4,4"/>
