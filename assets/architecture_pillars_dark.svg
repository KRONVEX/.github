  <circle cx="480" cy="216" r="3.2" fill="#10B981"/>
  <path d="M 787 216 C 787 242, 620 232, 620 256" fill="none" stroke="#818CF8" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="4,4"/>
