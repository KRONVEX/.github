<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 276" width="960" height="276" role="img" aria-label="KRONVEX Organization Command Banner">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0D1322"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="22%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="82%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmarkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="58%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="emblemRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="scanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="heroGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#162033" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
    <clipPath id="heroClip">
      <rect x="0.5" y="0.5" width="959" height="275" rx="16"/>
    </clipPath>
    <clipPath id="scanClip">
      <rect x="218" y="138" width="460" height="3" rx="1.5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect x="0" y="0" width="960" height="276" fill="url(#heroBg)"/>
    <rect x="0" y="0" width="960" height="276" fill="url(#heroGrid)"/>
    <rect x="0" y="0" width="960" height="276" fill="url(#glowCyan)"/>
    <rect x="0" y="0" width="960" height="276" fill="url(#glowViolet)"/>
  </g>
  <rect x="0.5" y="0.5" width="959" height="275" rx="16" fill="none" stroke="#1E293B" stroke-width="1"/>
  <path d="M 14 23 L 14 14 L 23 14 M 937 14 L 946 14 L 946 23 M 14 253 L 14 262 L 23 262 M 937 262 L 946 262 L 946 253" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.7" stroke-linecap="round"/>

  <!-- Top Telemetry Header -->
  <circle cx="34" cy="29" r="3.6" fill="#10B981">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <text x="46" y="33" fill="#10B981" font-size="10" font-weight="700" class="mono">SYSTEMS OPERATIONAL</text>
  <text x="480" y="33" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600" class="mono">KRONVEX  //  ENGINEERING &amp; INTELLIGENCE ORGANIZATION</text>
  <text x="926" y="33" text-anchor="end" fill="#94A3B8" font-size="10" font-weight="600" class="mono">GITHUB.COM/KRONVEX</text>
  <line x1="28" y1="46" x2="932" y2="46" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Orbital Emblem -->
  <g>
    <circle cx="126" cy="134" r="56" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,5" stroke-opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0 126 134" to="360 126 134" dur="36s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 126 134" to="0 126 134" dur="22s" repeatCount="indefinite"/>
      <circle cx="126" cy="134" r="42" fill="none" stroke="url(#emblemRing)" stroke-width="1.8" stroke-dasharray="48 18 22 18"/>
      <circle cx="168" cy="134" r="3.2" fill="#38BDF8"/>
      <circle cx="84" cy="134" r="2.8" fill="#818CF8"/>
    </g>
    <polygon points="150.2,120.0 150.2,148.0 126.0,162.0 101.8,148.0 101.8,120.0 126.0,106.0" fill="#0F1624" stroke="url(#emblemRing)" stroke-width="1.8"/>
    <path d="M 116 146 L 116 122 L 136 146 L 136 122" fill="none" stroke="#F8FAFC" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="116" cy="122" r="2.4" fill="#38BDF8"/>
    <circle cx="136" cy="146" r="2.4" fill="#10B981"/>
    <circle cx="126" cy="134" r="14" fill="#38BDF8" fill-opacity="0.10">
      <animate attributeName="r" values="10;19;10" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.14;0.02;0.14" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Brand Lockup & Mission Copy -->
  <rect x="218" y="64" width="248" height="22" rx="5" fill="#172036" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.45"/>
  <text x="342" y="79" text-anchor="middle" fill="#BAE6FD" font-size="9.5" font-weight="700" class="mono">APPLICATIONS · INTELLIGENCE · AI</text>

  <rect x="478" y="64" width="136" height="22" rx="5" fill="#1E1B4B" stroke="#818CF8" stroke-width="0.7" stroke-opacity="0.45"/>
  <text x="546" y="79" text-anchor="middle" fill="#C7D2FE" font-size="9.5" font-weight="700" class="mono">DEEP-TECH LAB</text>

  <text x="218" y="128" fill="url(#wordmarkGrad)" font-size="42" font-weight="800" letter-spacing="7" class="sans">KRONVEX</text>

  <!-- Animated Signal Bar -->
  <rect x="218" y="138" width="460" height="3" rx="1.5" fill="#1E293B"/>
  <g clip-path="url(#scanClip)">
    <rect x="118" y="138" width="140" height="3" fill="url(#scanBar)">
      <animate attributeName="x" values="118;678;118" dur="4.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="218" y="166" fill="#F8FAFC" font-size="14.2" font-weight="600" class="sans">Building cross-platform apps, market intelligence, and mission-critical AI</text>
  <text x="218" y="187" fill="#94A3B8" font-size="13.5" font-weight="500" class="sans">to solve complex real-world problems — engineered for scale, clarity, and reliability.</text>

  <!-- Bottom 3-Pillar Signal Strip -->
  <rect x="28" y="212" width="290" height="46" rx="9" fill="#0F1624" stroke="#1E293B" stroke-width="1"/>
  <rect x="28" y="220" width="3" height="30" rx="1.5" fill="#38BDF8"/>
  <circle cx="46" cy="229" r="3" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="57" y="233" fill="#F8FAFC" font-size="10.5" font-weight="700" class="mono">01 // CROSS-PLATFORM APPS</text>
  <text x="46" y="249" fill="#94A3B8" font-size="10" class="sans">Web · iOS · Android · Desktop · Edge</text>
  <rect x="335" y="212" width="290" height="46" rx="9" fill="#0F1624" stroke="#1E293B" stroke-width="1"/>
  <rect x="335" y="220" width="3" height="30" rx="1.5" fill="#10B981"/>
  <circle cx="353" cy="229" r="3" fill="#10B981">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="364" y="233" fill="#F8FAFC" font-size="10.5" font-weight="700" class="mono">02 // MARKET INTELLIGENCE</text>
  <text x="353" y="249" fill="#94A3B8" font-size="10" class="sans">Quant Pipelines · Live Signals · Macro</text>
  <rect x="642" y="212" width="290" height="46" rx="9" fill="#0F1624" stroke="#1E293B" stroke-width="1"/>
  <rect x="642" y="220" width="3" height="30" rx="1.5" fill="#818CF8"/>
  <circle cx="660" cy="229" r="3" fill="#818CF8">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="671" y="233" fill="#F8FAFC" font-size="10.5" font-weight="700" class="mono">03 // MISSION-CRITICAL AI</text>
  <text x="660" y="249" fill="#94A3B8" font-size="10" class="sans">Neural Models · Agents · High-Reliability</text>
</svg>
